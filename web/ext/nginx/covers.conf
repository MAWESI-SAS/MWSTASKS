#
# Portadas de proyecto: Plane guarda en la base la URL con el hash del archivo (p. ej. /assets/image_3-DgxArbnE.jpg).
# Al reemplazar las imágenes (o al actualizar Plane) el hash cambia y esas URLs quedarían rotas. Esta regla sirve
# cualquier /assets/image_N-<hash>.jpg con la portada N actual (copia estable en /mawesi-covers/).
location ~ "^/assets/image_([0-9]+)-[A-Za-z0-9_-]+\.jpg$" {
  root /usr/share/nginx/html;
  try_files /mawesi-covers/image_$1.jpg =404;
  add_header Cache-Control "public, max-age=86400";
  add_header X-Content-Type-Options "nosniff" always;
}
